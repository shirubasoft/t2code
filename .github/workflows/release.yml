name: Release
run-name: T2 release ${{ inputs.sha || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Complete merged main commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  T3CODE_DESKTOP_UPDATE_REPOSITORY: shirubasoft/t2code

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      ready: ${{ steps.meta.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: meta
        run: node .github/t2code/release.mjs metadata
        env:
          GH_TOKEN: ${{ github.token }}
          T2_RELEASE_SHA: ${{ inputs.sha || github.sha }}

  quality:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.metadata.outputs.sha }}
      base: ${{ github.sha }}

  build_bundle:
    needs: metadata
    if: needs.metadata.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: false
      - name: Install build dependencies
        run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Install browser secret helper build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Verify source and build release bundle
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node .github/t2code/overlay.mjs verify
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run build:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 3

  desktop_mac_arm64:
    name: macOS arm64
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  desktop_mac_x64:
    name: macOS x64
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: macOS x64
      runner: macos-15-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  desktop_linux_x64:
    name: Linux x64
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  desktop_linux_arm64:
    name: Linux arm64
    needs: [metadata, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Linux arm64
      runner: ubuntu-24.04-arm
      platform: linux
      target: AppImage
      arch: arm64
      rust_target: aarch64-unknown-linux-gnu
      resource_key: linux-arm64
      cli_archive: true
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  desktop_win_x64:
    name: Windows x64
    needs: [metadata, build_bundle, desktop_linux_x64]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows x64
      runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  desktop_win_arm64:
    name: Windows arm64
    needs: [metadata, build_bundle, desktop_linux_arm64]
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: Windows arm64
      runner: windows-11-arm
      platform: win
      target: nsis
      arch: arm64
      rust_target: aarch64-pc-windows-msvc
      resource_key: win32-arm64
      cli_archive: true
      version: ${{ needs.metadata.outputs.version }}
      ref: ${{ needs.metadata.outputs.sha }}
      release_channel: stable

  publish:
    needs:
      [
        metadata,
        quality,
        desktop_mac_arm64,
        desktop_mac_x64,
        desktop_linux_x64,
        desktop_linux_arm64,
        desktop_win_x64,
        desktop_win_arm64,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      T2_RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
      T2_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Assemble feeds, provenance and checksums
        run: node .github/t2code/release.mjs assemble release-assets
      - name: Publish exact merged commit
        run: node .github/t2code/release.mjs publish release-assets
        env:
          GH_TOKEN: ${{ github.token }}
