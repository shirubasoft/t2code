name: Merge validated upstream
run-name: T2 merge validation @${{ github.event.workflow_run.id || inputs.validation_run_id }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful trusted CI run to finish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upstream-merge
  cancel-in-progress: false

jobs:
  merge:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify exact candidate and merge without bypass
        run: node .github/t2code/sync.mjs finish
        env:
          GH_TOKEN: ${{ github.token }}
