name: Upstream sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      base: ${{ steps.plan.outputs.base }}
      upstream: ${{ steps.plan.outputs.upstream }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: plan
        run: node .github/t2code/sync.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.plan.outputs.ready == 'true'
        with:
          name: analytics-history
          path: review/
          retention-days: 7

  analytics:
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: [self-hosted, linux, t2code-sync]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: pingdotgg/t3code
          ref: ${{ needs.plan.outputs.upstream }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: analytics-history
          path: review
      - name: Review commit history and adapt analytics patches
        run: |
          set -euo pipefail
          output_dir=$(mktemp -d "$RUNNER_TEMP/t2-agent-output-XXXXXX")
          t2code-codex "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/control/.github/t2code/agent-output.schema.json" \
            "$output_dir" "$GITHUB_WORKSPACE/review" < control/.github/t2code/migrate.md
          cp "$output_dir/agent-output.json" agent-output.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analytics-review
          path: agent-output.json
          retention-days: 7

  propose:
    needs: [plan, analytics]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.propose.outputs.sha }}
      pr: ${{ steps.propose.outputs.pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: analytics-history
          path: context
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: analytics-review
          path: context
      - id: propose
        working-directory: candidate
        run: node ../control/.github/t2code/sync.mjs propose
        env:
          GH_TOKEN: ${{ github.token }}
          T2_SYNC_CONTEXT: ${{ github.workspace }}/context

  validate:
    needs: [plan, propose]
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.propose.outputs.sha }}
      base: ${{ needs.plan.outputs.base }}
      pr: ${{ needs.propose.outputs.pr }}
    permissions:
      contents: read
      actions: read

  merge:
    needs: [plan, propose, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Merge the validated commit and publish a release
        run: node .github/t2code/sync.mjs merge
        env:
          GH_TOKEN: ${{ github.token }}
          T2_CANDIDATE_SHA: ${{ needs.propose.outputs.sha }}
          T2_BASE_SHA: ${{ needs.plan.outputs.base }}
          T2_SYNC_PR: ${{ needs.propose.outputs.pr }}
